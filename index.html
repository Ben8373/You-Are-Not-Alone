<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Capstone Project</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cal+Sans&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;400;500;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="assets/css/style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </head>
  <body>
    <nav
      class="navbar navbar-expand-lg bg-transparent"
      style="position: absolute; right: 0; z-index: 10"
    >
      <div class="container-fluid justify-content-center">
        <ul class="navbar-nav flex-row mx-auto pt-4 gap-5">
          <li class="nav-item">
            <a
              class="nav-link btn btn-outline-light inter-font border-0"
              href="#"
              >Home</a
            >
          </li>
          <li class="nav-item">
            <a
              class="nav-link btn btn-outline-light inter-font border-0"
              href="#"
              >About</a
            >
          </li>
          <li class="nav-item">
            <a
              class="nav-link btn btn-outline-light inter-font border-0"
              href="#"
              >Services</a
            >
          </li>
          <li class="nav-item">
            <a
              class="nav-link btn btn-outline-light inter-font border-0"
              href="#"
              >Contact</a
            >
          </li>
        </ul>
      </div>
    </nav>

    <header class="position-relative">
      <img
        src="assets/images/210725_2R5_8470.webp"
        alt="hero-Image"
        class="img-fluid w-100"
      />
      <div
        class="position-absolute top-50 start-50 translate-middle text-center text-white"
      >
        <h1 class="cal-sans-regular custom-color hero-title" style>
          You are not alone.
        </h1>
        <p class="cal-sans-regular" style="font-size: 1rem">
          A Supportive and Non-Judgemental Space to Encourage Better Mental
          Health
        </p>
      </div>
    </header>

    <main>
      <section
        class="container-fluid"
        id="mission-container"
        aria-label="mission and values"
      >
        <img
          src="assets/images/pexels-lukas-rychvalsky-670720.jpg"
          class="img-fluid"
          alt="Mission and Values Image"
        />
        <h2 class="cal-sans-regular custom-color hero-title">
          Mission and Values
        </h2>
      </section>
      <section
        class="container-fluid"
        id="help-section"
        aria-label="help"
      ></section>
      <section
        class="container-fluid"
        id="resources-section"
        aria-label="resources and information"
      ></section>
      <section
        class="container-fluid"
        id="care-section"
        aria-label="self-care"
      ></section>
      <section
        class="container-fluid"
        id="contact-section"
        aria-label="contact form"
      >
        <img
          src="assets/images/denny-muller-PfVo6Be4Tg4-unsplash.jpg"
          class="img-fluid"
          alt="Contact Image"
        />
        <div class="container">
          <h2 class="cal-sans-regular custom-color hero-title">
            Reach out to us
          </h2>
          <form>
            <div class="mb-3">
              <label for="name" class="form-label">Name</label>
              <input type="text" class="form-control" id="name" required />
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" id="email" required />
            </div>
            <div class="mb-3">
              <label for="message" class="form-label">Message</label>
              <textarea
                class="form-control"
                id="message"
                rows="4"
                required
              ></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
          </form>
        </div>
      </section>
    </main>
    <footer></footer>
  </body>
</html>
